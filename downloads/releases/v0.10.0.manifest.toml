version = "0.10.0"
date = "2026-06-26"
changelog = ["Added automatic repository optimization to keep frequently-synced repositories fast and reliable — optional in Sync settings", "Added an Optimize repository action to speed up syncing", "Added in-app recovery for an invalid license, plus safeguards against accidental edits", "Your license now keeps working even if the license server is unreachable", "Over the free-note limit, you can now edit conflicted notes and system files to recover", "Sync now flags when a repository needs optimization and pauses retries until it recovers", "Cleaner sync history — saving an unchanged note no longer commits it", "Improved battery life on mobile by pausing background activity when you switch away", "Fixed an open, empty note not showing content synced from another device until reopened"]

