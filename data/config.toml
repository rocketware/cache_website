# Cache Website Configuration Data
# Product IDs, pricing, and server URLs for license management pages.

[domains]
website = "https://www.cachenotes.app"
license_server = "https://api.cachenotes.app"

# Currencies
[currencies]
default = "usd"
supported = ["usd", "gbp", "eur"]

[currencies.usd]
symbol = "$"
label = "USD"
position = "prefix"

[currencies.gbp]
symbol = "£"
label = "GBP"
position = "prefix"

[currencies.eur]
symbol = "€"
label = "EUR"
position = "prefix"

# Personal plan — graduated pricing by repository count
# First repo at full price, each additional at a flat discount rate
[plans.personal]
display_name = "Personal"
tagline = "Ideal for individuals and families"
pricing_model = "graduated"
product_id = "prod_UBSSFOAN7sYVCo"
monthly_id = "price_1TH5gpHAn6iWiQrYaaapmETX"
annual_id = "price_1TH5tgHAn6iWiQrYzcm0fNL8"
unit = "repository"
units = "repositories"
min = 1
max = 5

[[plans.personal.tiers]]
up_to = 1
monthly = { gbp = 2.50, usd = 3.00, eur = 2.75 }
annual = { gbp = 24, usd = 30, eur = 28 }

[[plans.personal.tiers]]
monthly = { gbp = 0.50, usd = 0.75, eur = 0.75 }
annual = { gbp = 6, usd = 9, eur = 8 }

# Business plan — graduated pricing by seat count
# Single shared repository per subscription. First 10 seats at full price,
# each additional at a flat discount rate.
# NOTE: Stripe prices need reconfiguring from volume to graduated model
[plans.business]
pricing_model = "graduated"
display_name = "Business"
tagline = "For teams and organisations"
product_id = "prod_UBSSY105M5P6y3"
monthly_id = "price_1TD8P5HAn6iWiQrYZEuccLYg"
annual_id = "price_1TD8QqHAn6iWiQrYFli8F9Ub"
unit = "seat"
units = "seats"
min = 1
max = 100

[[plans.business.tiers]]
up_to = 10
monthly = { gbp = 3.75, usd = 4.50, eur = 4.00 }
annual = { gbp = 36, usd = 45, eur = 40 }

[[plans.business.tiers]]
monthly = { gbp = 2.50, usd = 3.00, eur = 2.75 }
annual = { gbp = 24, usd = 30, eur = 27 }

# Founder plan — one-time lifetime purchase (limited availability)
[plans.founder]
display_name = "Founder"
tagline = "Lifetime license, limited availability"
pricing_model = "fixed"
product_id = "prod_UBSSAq3PeJTtZy"
price_id = "price_1TD5Y4HAn6iWiQrYx78SoqiS"
repositories = 3

[plans.founder.price]
gbp = 100
usd = 130
eur = 120

# Personal — Perpetual (one-time; own Cache 1.x forever)
# Three fixed repo tiers (1/3/5); each is a flat one-time, multi-currency price.
# price_id MUST equal the server product key (Config.lookupProduct) — live-mode
# IDs matching config.dart ProductionStripeProducts.personalPerpetual{1,3,5}.
# Keep numbers in sync with apps/notes/PRICING.md (authoritative).
[plans.personal_perpetual]
display_name = "Personal — Perpetual"
tagline = "Own Cache 1.x forever"
pricing_model = "perpetual"
app_version_max = 1

[[plans.personal_perpetual.options]]
repositories = 1
price_id = "price_1TqZDeHAn6iWiQrYdxsKySXZ"
price = { gbp = 49, usd = 64, eur = 59 }

[[plans.personal_perpetual.options]]
repositories = 3
price_id = "price_1TqZDXHAn6iWiQrYnf03IPq6"
price = { gbp = 79, usd = 99, eur = 94 }

[[plans.personal_perpetual.options]]
repositories = 5
price_id = "price_1TqZDNHAn6iWiQrYTcQWNk1W"
price = { gbp = 109, usd = 139, eur = 129 }
